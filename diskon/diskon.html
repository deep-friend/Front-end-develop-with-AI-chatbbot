<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Diskon</title>
    <link rel="stylesheet" href="diskon.css">
</head>
<body>

    <div class="container">
        <h2>Kalkulator Diskon</h2>
        
        <div class="input-group">
            <label>Harga Asli (Rp)</label>
            <input type="number" id="hargaAsli" placeholder="Contoh: 100000">
        </div>

        <div class="input-group">
            <label>Diskon (%)</label>
            <input type="number" id="persenDiskon" placeholder="Contoh: 20">
        </div>

        <button onclick="hitungDiskon()">Hitung Harga</button>

        <div class="result" id="hasil">
            <p>Hemat: <span id="hemat">Rp 0</span></p>
            <p><strong>Harga Akhir: <span id="hargaTotal">Rp 0</span></strong></p>
        </div>
    </div>

    <script src="diskon.js"></script>
</body>
</html>
